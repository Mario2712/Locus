name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, Lint & Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain-Tests
        run: ./gradlew :core:domain:test

      - name: App-Unit-Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: locus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test- und Lint-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/domain/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  release:
    name: Signierte Release-APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secrets wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret LOCUS_KEYSTORE_BASE64 fehlt – siehe README (Release-Signatur)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/locus-release.jks"
          echo "LOCUS_KEYSTORE_PATH=$RUNNER_TEMP/locus-release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          LOCUS_KEYSTORE_PASSWORD: ${{ secrets.LOCUS_KEYSTORE_PASSWORD }}
          LOCUS_KEY_ALIAS: ${{ secrets.LOCUS_KEY_ALIAS }}
          LOCUS_KEY_PASSWORD: ${{ secrets.LOCUS_KEY_PASSWORD }}
          LOCUS_VERSION_NAME: ${{ github.ref_name }}
        run: |
          export LOCUS_VERSION_NAME="${LOCUS_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "locus-${LOCUS_VERSION_NAME}.apk"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: locus-*.apk
          generate_release_notes: true
